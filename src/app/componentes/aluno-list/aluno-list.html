<div class="card shadow">
  <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Gestão de Alunos</h5>
    <button class="btn btn-light btn-sm">
      <i class="bi bi-person-plus"></i> Novo Aluno
    </button>
  </div>
  
  <div class="card-body">
    <table class="table table-hover mt-3">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>CPF</th>
          <th>Bairro</th>
          <th class="text-center">Ações</th>
        </tr>
      </thead>
      <tbody>
        @for (aluno of alunos; track aluno.id) {
          <tr>
            <td>{{ aluno.id }}</td>
            <td>{{ aluno.nome }}</td>
            <td>{{ aluno.cpf }}</td>
            <td>{{ aluno.bairro }}</td>
            <td class="text-center">
              <button class="btn btn-outline-warning btn-sm me-2"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger btn-sm" (click)="deletar(aluno.id!)"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="text-center text-muted">Nenhum aluno cadastrado.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
